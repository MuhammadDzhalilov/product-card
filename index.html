<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/clear-list.css" />
    <link rel="stylesheet" href="styles/compound.css" />
    <link rel="stylesheet" href="styles/catalog.css" />
    <link rel="stylesheet" href="styles/title.css" />
    <link rel="stylesheet" href="styles/card.css" />
    <link rel="stylesheet" href="styles/products.css" />
  </head>
  <body>
    <div class="catalog">
      <div class="catalog__container">
        <h1 class="title catalog__title">Выбери свой продукт</h1>
        <button id="card-color-change-btn">Сменить цвет первой карточки</button>
        <button id="all-cards-color-change-btn">Сменить цвет всех карточек</button>
        <button id="toggle-third-card-btn">Поменять цвет третьей карточки</button>
        <button id="toggle-color-btn">Поменять цвет кнопки</button>
        <button id="output-console-log">Вывести сообщение в консоль</button>
        <button id="open-page-google-btn">Открыть главную страницу  Google</button>
        <ul class="products clear-list">
          <template id="product-card-template">
          <li class="products__item card">
            <img
              src=""
              alt=""
              class="card__image"
            />
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <div class="card__description">
              <p></p>
            </div>
            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list">
                <li></li>
                <li></li>
                <li></li>
              </ul>
            </div>
            <div class="card__price">
              <b>Цена</b>
              <span></span>
            </div>
          </li>
          </template>

        </ul>
      </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/homework-7.js"></script>
    <script src="js/homework-8.js"></script>
    <script type="module" src="js/homework-9.js"></script>
    <script type="module" src="js/homework-10.js"></script>
  </body>
</html>
